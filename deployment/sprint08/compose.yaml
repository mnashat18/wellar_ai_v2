name: wellar-v2-sprint08

services:
  postgres:
    image: postgres:16.6-alpine
    pull_policy: never
    environment:
      POSTGRES_DB: wellar_v2_sprint08_test
      POSTGRES_USER: ${WELLAR_SPRINT08_POSTGRES_USER:?Generate .env.sprint08 first}
      POSTGRES_PASSWORD: ${WELLAR_SPRINT08_POSTGRES_PASSWORD:?Generate .env.sprint08 first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellar_sprint08 -d wellar_v2_sprint08_test"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    networks: [backend, access]

  minio:
    image: wellar-v2-sprint08-minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: never
    build:
      context: .
      dockerfile: minio.Dockerfile
      args:
        MINIO_REF: RELEASE.2025-10-15T17-29-55Z
        MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${WELLAR_SPRINT08_MINIO_ROOT_USER:?Generate .env.sprint08 first}
      MINIO_ROOT_PASSWORD: ${WELLAR_SPRINT08_MINIO_ROOT_PASSWORD:?Generate .env.sprint08 first}
      MINIO_KMS_SECRET_KEY: ${WELLAR_SPRINT08_MINIO_KMS_SECRET_KEY:?Add a test-only KMS key to .env.sprint08 first}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    networks: [backend, access]

  minio-init:
    image: wellar-v2-sprint08-api:local
    build:
      context: ../..
      dockerfile: Dockerfile
      pull: false
    env_file:
      - ../../.env.sprint08
    volumes:
      - ../../deployment/sprint08:/srv/wellar/deployment/sprint08:ro
    command: ["python", "-m", "deployment.sprint08.init_minio"]
    depends_on:
      minio:
        condition: service_started
    mem_limit: 512m
    cpus: 0.5
    restart: "no"
    networks: [backend]

  migrate:
    image: wellar-v2-sprint08-api:local
    build:
      context: ../..
      dockerfile: Dockerfile
      pull: false
    env_file:
      - ../../.env.sprint08
    command: ["python", "-m", "app.queue.migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    restart: "no"
    networks: [backend]

  api:
    image: wellar-v2-sprint08-api:local
    build:
      context: ../..
      dockerfile: Dockerfile
      pull: false
    env_file:
      - ../../.env.sprint08
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    networks: [backend, access]

  worker:
    image: wellar-v2-sprint08-worker:local
    build:
      context: ../..
      dockerfile: Dockerfile
      pull: false
    env_file:
      - ../../.env.sprint08
    environment:
      WELLAR_WORKER_COUNT: ${WELLAR_SPRINT08_WORKER_COUNT:-1}
    command: ["python", "-m", "app.workers.entrypoint"]
    init: true
    stop_grace_period: 45s
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib,sys; me=str(os.getpid()); worker=next((p for p in pathlib.Path('/proc').glob('[0-9]*/cmdline') if p.parent.name!=me and p.read_bytes().split(b'\\0')[1:3]==[b'-m',b'app.workers.entrypoint']),None); marker=(pathlib.Path('/tmp')/('wellar-worker-ready-'+worker.parent.name)) if worker else None; sys.exit(0 if marker is not None and marker.is_file() and marker.read_text(encoding='ascii').startswith('worker-') else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      replicas: ${WELLAR_SPRINT08_WORKER_COUNT:-1}
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    networks: [backend]

networks:
  backend:
    internal: true
  access:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
