services:
  api:
    build: .
    env_file: .env
    environment:
      WELLAR_DB_PATH: /var/lib/wellar/wellar.sqlite3
      WELLAR_MEDIA_ROOT: /var/lib/wellar/media
    ports: ["8000:8000"]
    volumes: ["wellar-data:/var/lib/wellar"]
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
  worker:
    build: .
    env_file: .env
    environment:
      WELLAR_DB_PATH: /var/lib/wellar/wellar.sqlite3
      WELLAR_MEDIA_ROOT: /var/lib/wellar/media
    volumes: ["wellar-data:/var/lib/wellar"]
    command: ["python","-m","app.workers.entrypoint"]
    depends_on: [api]
volumes:
  wellar-data:
