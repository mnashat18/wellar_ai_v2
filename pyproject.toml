[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wellar-ai-v2"
version = "0.1.0"
description = "Standalone Wellar AI V2 backend foundation"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.143.2",
  "starlette==1.3.1",
  "uvicorn==0.34.2",
  "pydantic==2.11.4",
  "python-dotenv==1.2.2",
  "numpy==1.26.4",
  "opencv-contrib-python==4.10.0.84",
  "mediapipe==0.10.21",
  "protobuf==4.25.9",
  "pillow==12.3.0",
  "psycopg[binary]==3.2.6",
  "psycopg-pool==3.3.3",
  "boto3==1.37.18",
  "PyJWT[crypto]==2.15.0",
  "opentelemetry-api==1.45.1",
  "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
