services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wellar_sprint08
      POSTGRES_DB: wellar_v2_sprint08_test
      POSTGRES_PASSWORD: ${V2_TEST_POSTGRES_PASSWORD:?set a disposable local test password}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellar_sprint08 -d wellar_v2_sprint08_test"]
      interval: 3s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${V2_TEST_MINIO_ROOT_USER:?set a disposable local test username}
      MINIO_ROOT_PASSWORD: ${V2_TEST_MINIO_ROOT_PASSWORD:?set a disposable local test password}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    tmpfs:
      - /data
